<div
  class=" bg-surface-container-low/15 rounded-xl flex flex-col lg:flex-row items-start lg:items-center justify-end gap-rally-md relative">
  <div class="flex items-center gap-rally-sm flex-wrap w-full lg:w-auto">
    <div class="w-full lg:w-48">
      <app-searchable-select
        [options]="statusOptions"
        [selected]="status()[0] ?? 'ALL'"
        (selectedChange)="onStatusChange($event)"
        placeholder="All Statuses"
        searchPlaceholder="Search status..." />
    </div>
  </div>
</div>
