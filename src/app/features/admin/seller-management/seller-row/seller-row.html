<td class="py-rally-md px-rally-lg">
  <div class="flex items-center gap-rally-sm">
    @if (seller().avatarUrl) {
      <div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden shadow-sm">
        <img class="w-full h-full object-cover" [src]="seller().avatarUrl" [alt]="seller().name" />
      </div>
    } @else {
      <div
        class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden shadow-sm flex items-center justify-center text-primary-container font-headline-md"
      >
        {{ initials() }}
      </div>
    }
    <div class="flex flex-col min-w-0">
      <span class="font-headline-md text-[16px] truncate text-on-surface">{{ seller().name }}</span>
      <span class="text-label-sm font-label-sm text-on-surface-variant truncate">{{ seller().email }}</span>
    </div>
  </div>
</td>
<td class="py-rally-md px-rally-lg text-on-surface-variant">{{ seller().joinedAt | date: 'MMM d, y' }}</td>
<td class="py-rally-md px-rally-lg">{{ seller().productsCount }}</td>
<td class="py-rally-md px-rally-lg">
  <div class="flex items-center gap-rally-sm">
    @if (flagLabel()) {
      <span
        class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-tertiary-container text-on-tertiary-container font-headline-md text-[14px]"
        [class.shadow-sm]="pulsing()"
        [class.animate-pulse]="pulsing()"
      >
        {{ seller().pendingApprovals }}
      </span>
      <span class="text-label-sm font-label-sm text-tertiary">{{ flagLabel() }}</span>
    } @else {
      <span
        class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant font-headline-md text-[14px]"
      >
        {{ seller().pendingApprovals }}
      </span>
    }
  </div>
</td>
<td class="py-rally-md px-rally-lg text-right">
  <a
    [routerLink]="['/admin/seller-management', seller().id]"
    [attr.aria-label]="'View ' + seller().name"
    class="inline-flex items-center justify-center p-2 rounded-full hover:bg-primary-container/20 text-primary transition-colors group-hover:bg-surface-container-high"
  >
    <span class="material-symbols-outlined text-[18px]">visibility</span>
  </a>
</td>
