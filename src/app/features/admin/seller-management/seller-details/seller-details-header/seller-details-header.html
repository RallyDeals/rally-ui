<header class="flex flex-col md:flex-row md:items-end justify-between gap-rally-md relative">
  <div class="flex flex-col gap-rally-xs z-10">
    <div class="flex items-center gap-rally-sm">
      <span class="material-symbols-outlined text-primary-container text-[24px]">storefront</span>
      <span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">Seller Profile</span>
    </div>
    <h1 class="font-display-lg text-display-lg-mobile text-on-background m-0">
      {{ seller()?.name ?? (loading() ? 'Loading…' : 'Seller not found') }}
    </h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant">
      Manage product listings, monitor approval statuses, and oversee inventory for this seller account.
    </p>
  </div>

  <div
    class="absolute right-0 top-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10 -mr-16 -mt-16 pointer-events-none"
  ></div>
</header>
