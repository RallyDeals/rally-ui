<main class="min-h-screen bg-background">
  <div class="flex flex-col w-full px-rally-lg gap-rally-lg">
    <app-page-header title="Categories Management" subtitle="Manage product categories and track assigned inventory.">
      <button
        (click)="openCreateDialog()"
        class="bg-primary hover:bg-primary-container text-on-primary font-label-sm py-rally-sm px-rally-md rounded-full shadow-sm hover:shadow-md transition-all duration-300 transform hover:scale-[1.02] flex items-center gap-rally-xs w-fit"
      >
        <span class="material-symbols-outlined text-[18px]">add</span>
        Add Category
      </button>
    </app-page-header>
    <div class="bg-surface rounded-2xl shadow-xl overflow-hidden relative group">
      <div
        class="absolute inset-0 bg-gradient-to-b from-surface-container-low/50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-1000 pointer-events-none"
      ></div>

      @if (loadError(); as err) {
        <app-error-state [error]="err" [showRetry]="true" (retry)="loadCategories()" />
      } @else {
        <div class="overflow-x-auto relative z-10">
          <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-surface-container-low/50">
              <th class="py-rally-sm px-rally-lg text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest whitespace-nowrap">Category Name</th>
              <th class="py-rally-sm px-rally-lg text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest whitespace-nowrap">Description</th>
              <th class="py-rally-sm px-rally-lg text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest whitespace-nowrap">Products Count</th>
              <th class="py-rally-sm px-rally-lg text-right text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest whitespace-nowrap">Actions</th>
            </tr>
            </thead>
            <tbody class="text-body-md font-body-md text-on-surface">
              @if (loading()) {
                @for (skeleton of [1, 2, 3, 4]; track skeleton) {
                  <tr class="animate-pulse">
                    <td class="px-rally-md py-rally-md">
                      <div class="flex items-center gap-rally-sm">
                        <div class="w-10 h-10 rounded-lg bg-surface-container-high shrink-0"></div>
                        <div class="h-4 w-32 bg-surface-container-high rounded"></div>
                      </div>
                    </td>
                    <td class="px-rally-md py-rally-md"><div class="h-4 w-40 bg-surface-container-high rounded"></div></td>
                    <td class="px-rally-md py-rally-md"><div class="h-4 w-16 bg-surface-container-high rounded"></div></td>
                    <td class="px-rally-md py-rally-md text-right">
                      <div class="flex justify-end gap-rally-xs">
                        <div class="h-8 w-8 bg-surface-container-high rounded-full"></div>
                        <div class="h-8 w-8 bg-surface-container-high rounded-full"></div>
                      </div>
                    </td>
                  </tr>
                }
              } @else {
                @for (category of categories(); track category.id) {
                  <tr app-category-row [category]="category" (edit)="openUpdateDialog($event)" (delete)="onCategoryDelete($event)" class="hover:bg-surface-container-lowest/80 transition-colors group relative"></tr>
                } @empty {
                  <tr>
                    <td class="px-rally-md py-rally-md text-center text-on-surface-variant" colspan="4">No categories yet.</td>
                  </tr>
                }
              }
            </tbody>
          </table>
        </div>
        <div class="p-rally-sm bg-surface-container-low/50 flex items-center justify-between relative z-10 text-label-sm font-label-sm text-on-surface-variant">
          <span>{{ categories().length }} categories</span>
        </div>
      }
    </div>
  </div>

  <app-category-form-dialog
    [open]="showDialog()"
    [category]="editingCategory()"
    (saved)="onCategorySaved($event)"
    (closed)="closeDialog()"
  />
  <app-error-modal [error]="actionError()" (closed)="closeActionError()" />
</main>
