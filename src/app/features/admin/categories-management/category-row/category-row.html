<td class="px-rally-md py-rally-md">
  <div class="flex items-center gap-rally-sm">
    <div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary group-hover:bg-primary/10 transition-colors">
      <span class="material-symbols-outlined text-[20px]">{{ category().icon || 'category' }}</span>
    </div>
    <span class="font-headline-md text-[16px] text-on-surface group-hover:text-primary transition-colors">{{ category().name }}</span>
  </div>
</td>
<td class="px-rally-md py-rally-md max-w-[280px]">
  <span class="font-body-md text-on-surface-variant text-[14px] truncate block">{{ category().description || '—' }}</span>
</td>
<td class="px-rally-md py-rally-md">
  <div class="flex items-center gap-rally-xs">
    <span class="font-body-md text-on-surface font-medium">{{ category().productsCount | number }}</span>
    <span class="font-body-md text-on-surface-variant text-[14px]">items</span>
  </div>
</td>
<td class="px-rally-md py-rally-md text-right">
  <div class="flex items-center justify-end gap-rally-xs">
    <button [attr.aria-label]="'Edit ' + category().name" class="w-8 h-8 inline-flex items-center justify-center rounded-full text-on-surface-variant hover:text-primary hover:bg-primary-container/10 transition-colors">
      <span class="material-symbols-outlined text-[18px]">edit</span>
    </button>
    <button [attr.aria-label]="'Delete ' + category().name" class="w-8 h-8 inline-flex items-center justify-center rounded-full text-on-surface-variant hover:text-error hover:bg-error-container transition-colors">
      <span class="material-symbols-outlined text-[18px]">delete</span>
    </button>
  </div>
</td>
