<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="w-full flex items-center gap-rally-sm bg-surface-container-lowest border-none rounded-lg px-rally-md py-rally-xs text-body-md outline-none focus:ring-2 focus:ring-primary-container transition-all cursor-pointer"
  >
    <span class="w-8 h-8 rounded-lg bg-surface-container flex items-center justify-center text-primary shrink-0">
      <span class="material-symbols-outlined text-[18px]">{{ selected() || 'help' }}</span>
    </span>
    <span class="flex-1 text-left truncate" [class.text-on-surface-variant]="!selected()">{{ selected() || placeholder() }}</span>
    <span
      class="material-symbols-outlined text-[18px] text-on-surface-variant transition-transform"
      [class.rotate-180]="open()"
      >expand_more</span
    >
  </button>

  @if (open()) {
    <div
      class="absolute z-20 mt-rally-xs w-72 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/30 overflow-hidden"
    >
      <div class="p-rally-xs border-b border-outline-variant/30">
        <div class="relative">
          <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-on-surface-variant text-[16px]"
            >search</span
          >
          <input
            type="text"
            class="w-full pl-9 pr-2 py-1.5 bg-surface-container-low rounded-md text-body-md outline-none focus:ring-2 focus:ring-primary-container transition-all"
            placeholder="Search icons..."
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </div>
      </div>
      <div class="max-h-56 overflow-y-auto p-rally-xs grid grid-cols-6 gap-rally-base">
        @for (icon of filteredIcons(); track icon) {
          <button
            type="button"
            [attr.aria-label]="icon"
            [attr.title]="icon"
            (click)="choose(icon)"
            class="w-9 h-9 rounded-lg flex items-center justify-center transition-colors hover:bg-surface-container"
            [class.bg-primary-container]="icon === selected()"
            [class.text-on-primary-container]="icon === selected()"
            [class.text-on-surface-variant]="icon !== selected()"
          >
            <span class="material-symbols-outlined text-[20px]">{{ icon }}</span>
          </button>
        } @empty {
          <p class="col-span-6 px-rally-xs py-rally-xs text-label-sm text-on-surface-variant">No icons found</p>
        }
      </div>
      @if (resultCount() > filteredIcons().length) {
        <p class="px-rally-xs py-rally-xs border-t border-outline-variant/30 text-label-sm text-on-surface-variant">
          Showing {{ filteredIcons().length }} of {{ resultCount() }} — keep typing to narrow down
        </p>
      }
    </div>
  }
</div>
