<section
  class="bg-inverse-surface rounded-xl p-rally-md md:p-rally-xl shadow-md text-inverse-on-surface relative overflow-hidden">
  <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
  <h2 class="font-headline-md text-inverse-on-surface mb-rally-lg">Order Summary</h2>
  <div class="space-y-rally-sm font-body-md mb-rally-md">
    <div class="flex justify-between items-center">
      <span class="opacity-80">Subtotal</span>
      <span>{{ summary().subtotal | currency:'USD' }}</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="opacity-80">{{ summary().shippingLabel }}</span>
      <span>{{ summary().shippingCost | currency:'USD' }}</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="opacity-80">Estimated Taxes</span>
      <span>{{ summary().estimatedTaxes | currency:'USD' }}</span>
    </div>
  </div>
  <div class="pt-rally-sm mt-rally-sm relative">
    <div class="absolute top-0 left-0 right-0 h-px bg-inverse-on-surface/20"></div>
    <div class="flex justify-between items-center">
      <div>
        <span class="font-headline-md text-lg">Total</span>
        <div class="text-xs opacity-60">{{ summary().totalNote }}</div>
      </div>
      <span class="font-display-lg-mobile text-primary-fixed-dim">{{ summary().total | currency:'USD' }}</span>
    </div>
  </div>
</section>
