<div class="p-rally-md flex items-start gap-rally-md">
  <div class="w-20 h-20 rounded bg-surface-container-low shrink-0 overflow-hidden relative">
    <img class="w-full h-full object-cover" [alt]="item().productName" [src]="item().productImageUrl">
  </div>
  <div class="flex-1 min-w-0 pt-1">
    <h3 class="font-body-md text-sm text-on-surface">{{ item().productName }}</h3>
    <div class="flex items-center gap-rally-md">
      <span class="font-body-md text-xs text-on-surface-variant">Qty: {{ item().quantity }}</span>
    </div>
  </div>
  <div class="text-right pt-1 flex flex-col items-end gap-1">
    <div class="font-body-md text-sm font-medium text-primary">${{ (item().unitPrice * item().quantity).toFixed(2) }}</div>
  </div>
</div>
