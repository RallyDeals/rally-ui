<div
  class="bg-pattern min-h-screen flex items-center justify-center p-gutter font-sans antialiased text-on-surface">
  <main class="w-full max-w-110 relative z-10">
    <div class="text-center mb-rally-lg">
      <app-logo />
    </div>

    <div
      class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(19,27,46,0.05)] border border-outline-variant/30 overflow-hidden relative">
      <div
        class="absolute top-0 left-0 right-0 h-1 bg-linear-to-r from-primary-fixed-dim to-primary-container"></div>
      <div class="p-rally-lg">
        @if (!done() && error(); as err) {
          <div
            class="flex items-center gap-2 px-3 py-2 mb-rally-sm rounded-lg bg-error-container text-on-error-container font-label-md text-label-md"
            role="alert"
          >
            <span class="material-symbols-outlined" style="font-size: 18px">error</span>
            <span>{{ err.message }}</span>
          </div>
        }
        @if (done()) {
        <div class="text-center py-rally-sm">
          <span
            class="material-symbols-outlined text-success text-[48px] block mb-rally-xs"
            style="color: #006c49">check_circle</span>
          <h2 class="font-headline-md text-headline-md mb-rally-xs">Password
            updated</h2>
          <p class="font-body-md text-body-md text-on-surface-variant">
            Your password has been changed. Sign in with your new password.
          </p>
        </div>
        } @else {
        <app-reset-password-form [submitting]="submitting()"
          (submitted)="onSubmitted($event)" />
        }
      </div>
      <div
        class="bg-surface-container-low p-rally-md border-t border-outline-variant/30 text-center">
        @if (done()) {
        <a
          routerLink="/auth/login"
          class="font-label-sm text-label-sm text-primary hover:text-primary-container font-semibold transition-colors">Go
          to sign in</a>
        } @else {
        <app-auth-switch-link
          prompt="Remembered it?"
          linkText="Sign in"
          linkPath="/auth/login" />
        }
      </div>
    </div>
  </main>
</div>
