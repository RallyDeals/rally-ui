<div class="mb-rally-lg border-b border-outline-variant">
  <nav aria-label="Tabs" class="-mb-px flex">
    @for (tab of tabs(); track tab.id) {
      <a
        [routerLink]="['/profile', tab.id]"
        routerLinkActive
        #rla="routerLinkActive"
        [attr.aria-current]="rla.isActive ? 'page' : null"
        [ngClass]="rla.isActive
          ? 'border-primary text-primary'
          : 'border-transparent text-on-surface-variant hover:text-on-surface hover:border-outline'"
        class="flex-1 flex items-center justify-center text-center py-2 px-1 sm:py-4 sm:px-2 border-b-2 font-medium text-xs sm:text-sm whitespace-nowrap"
      >
        {{ tab.label }}
      </a>
    }
  </nav>
</div>
