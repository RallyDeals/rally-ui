<div
  class="flex items-center gap-rally-sm bg-surface-container-lowest p-rally-sm rounded-lg border border-outline-variant shadow-sm">
  <img [src]="avatarUrl()" [alt]="avatarAlt()" class="w-10 h-10 rounded-full object-cover" />
  <p class="font-semibold text-on-surface">{{ name() }}</p>
  <button
    type="button"
    class="flex items-center gap-1 px-3 py-2 rounded-lg border border-outline-variant text-on-surface-variant hover:border-error hover:text-error transition-colors cursor-pointer"
    (click)="logout.emit()"
  >
    <span class="material-symbols-outlined text-[18px]">logout</span>
    <span class="font-label-sm text-label-sm">Logout</span>
  </button>
</div>
