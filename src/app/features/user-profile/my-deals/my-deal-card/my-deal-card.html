<div
  class="bg-surface-container-lowest rounded-lg soft-shadow overflow-hidden hover-lift border border-outline-variant flex flex-col md:flex-row"
  [ngClass]="{ 'opacity-75': deal().isCompleted }"
>
  <div class="w-full md:w-1/3 h-48 md:h-auto relative">
    <img
      [src]="deal().image"
      [alt]="deal().imageAlt"
      class="w-full h-full object-cover"
      [ngClass]="{ grayscale: deal().isCompleted }"
    />
    <div
      class="absolute top-rally-sm right-rally-sm bg-surface-container-lowest/90 backdrop-blur-sm px-2 py-1 rounded-lg text-xs font-bold flex items-center gap-1 border border-outline-variant"
      [ngClass]="deal().timeTextClass"
    >
      <span class="material-symbols-outlined text-[10px]">{{ deal().timeIcon }}</span> {{ deal().timeLabel }}
    </div>
  </div>
  <div class="p-rally-md flex-1 flex flex-col justify-between">
    <div>
      <div class="flex justify-between items-start mb-2">
        <h4 class="font-bold text-on-surface text-lg leading-tight">{{ deal().title }}</h4>
        <span
          class="text-[10px] px-2 py-1 rounded-full font-bold uppercase tracking-wider"
          [ngClass]="deal().statusBadgeClass"
        >{{ deal().statusLabel }}</span>
      </div>
      <div class="flex items-baseline gap-2 mb-4">
        <span class="font-headline-md text-headline-md font-bold text-on-surface">${{ deal().price }}</span>
        <span class="text-sm text-on-surface-variant line-through">${{ deal().originalPrice }}</span>
      </div>
    </div>
    <div>
      <div class="flex justify-between text-sm mb-1">
        <span class="text-on-surface-variant">{{ deal().joined }} / {{ deal().totalSpots }} Joined</span>
        <span class="font-bold" [ngClass]="deal().isCompleted ? 'text-secondary' : 'text-primary'">{{ deal().progressPercent }}%</span>
      </div>
      <div class="w-full bg-surface-container-low rounded-full h-2.5 relative">
        <div
          class="h-2.5 rounded-full"
          [ngClass]="deal().isCompleted ? 'bg-secondary' : 'deal-progress-bar'"
          [style.width.%]="deal().progressPercent"
        ></div>
        @if (!deal().isCompleted) {
          <div
            class="absolute top-1/2 -translate-y-1/2 translate-x-1/2 w-4 h-4 bg-white border-2 border-primary rounded-full pulse-tip"
            [style.right.%]="100 - deal().progressPercent"
          ></div>
        }
      </div>
      <div class="mt-4">
        <button
          class="w-full bg-surface-container-lowest border border-outline hover:border-primary text-on-surface hover:text-primary py-2 rounded-lg font-semibold transition-colors text-sm">
          {{ deal().isCompleted ? 'View Details' : 'Share Deal' }}
        </button>
      </div>
    </div>
  </div>
</div>
