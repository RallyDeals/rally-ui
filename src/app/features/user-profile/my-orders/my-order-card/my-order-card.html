<div
  class="bg-surface-container-lowest rounded-lg p-rally-md soft-shadow hover-lift border border-outline-variant transition-shadow group relative overflow-hidden"
  [ngClass]="{ 'opacity-75': order().isMuted }"
>
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-rally-md">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-rally-md flex-1">
      <div>
        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-rally-base">Order ID</p>
        <p class="font-body-md font-semibold text-on-surface">{{ order().id }}</p>
      </div>
      <div>
        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-rally-base">Date Placed</p>
        <p class="font-body-md text-on-surface">{{ order().datePlaced }}</p>
      </div>
      <div>
        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-rally-base">Total Amount</p>
        <p class="font-body-md font-semibold text-on-surface">{{ order().total }}</p>
      </div>
      <div>
        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-rally-base">Items</p>
        <p class="font-body-md text-on-surface">{{ order().itemsLabel }}</p>
      </div>
      <div class="col-span-2 md:col-span-1">
        <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-rally-base">Shipping</p>
        <p class="font-body-md text-on-surface truncate">{{ order().shippingAddress }}</p>
      </div>
    </div>
    <div class="flex items-center gap-rally-md shrink-0 w-full md:w-auto justify-between md:justify-end">
      <span
        class="inline-flex items-center gap-rally-xs px-rally-sm py-rally-xs rounded-full font-label-sm text-label-sm"
        [ngClass]="order().statusBadgeClass"
      >
        @if (order().statusIcon) {
          <span class="material-symbols-outlined text-[14px]">{{ order().statusIcon }}</span>
        } @else {
          <span class="w-2 h-2 rounded-full" [ngClass]="order().statusDotClass"></span>
        }
        {{ order().statusLabel }}
      </span>
      <button
        class="bg-surface-container-lowest border border-outline hover:border-primary text-on-surface hover:text-primary px-rally-lg py-rally-sm rounded-lg font-semibold transition-colors text-sm">
        View Details
      </button>
    </div>
  </div>
</div>
