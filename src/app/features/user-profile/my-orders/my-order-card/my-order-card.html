<div
  class="bg-surface-container-lowest rounded-lg p-rally-md soft-shadow hover-lift border border-outline-variant transition-shadow group relative overflow-hidden"
  [ngClass]="{ 'opacity-75': isMuted() }"
>
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-rally-md">
    <div class="grid grid-cols-2 md:grid-cols-5 gap-rally-md flex-1">
      <div>
        <p class="section-label">Order
          ID</p>
        <p class="font-body-md font-semibold text-on-surface">{{ orderIdLabel() }}</p>
      </div>
      <div>
        <p class="section-label">Date
          Placed</p>
        <p class="body-text">{{ order().createdAt | date:'MMM dd, y' }}</p>
      </div>
      <div>
        <p class="section-label">Total
          Amount</p>
        <p class="font-body-md font-semibold text-on-surface">{{ order().totalPrice | currency:'USD' }}</p>
      </div>
      <div>
        <p class="section-label">Items</p>
        <p class="body-text">{{ itemsLabel() }}</p>
      </div>
      <div class="col-span-2 md:col-span-1">
        <p class="section-label">Order
          Type</p>
        <p class="body-text">{{ orderTypeLabel() }}</p>
      </div>
    </div>
    <div class="flex items-center gap-rally-md shrink-0 w-full md:w-auto justify-between md:justify-end">
      @if (order().shippingStatus; as status) {
        <app-shipping-status-badge [status]="status" />
      } @else {
        <app-order-status-badge [status]="order().status" />
      }
      <button
        [routerLink]="['/orders', order().orderId]"
        class="bg-surface-container-lowest border border-outline hover:border-primary text-on-surface hover:text-primary px-rally-lg py-rally-sm rounded-lg font-semibold transition-colors text-sm">
        View Details
      </button>
    </div>
  </div>
</div>
