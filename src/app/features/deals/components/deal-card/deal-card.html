<article
  class="group bg-surface-container-lowest rounded-xl soft-shadow hover-lift overflow-hidden flex flex-col relative border border-outline-variant/10"
>
  <div class="h-48 relative bg-surface-container-low overflow-hidden">
    <a [routerLink]="['/deals', deal().id]" class="block w-full h-full">
      <img
        class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-500"
        [src]="deal().image"
        [alt]="deal().imageAlt"
      />
    </a>
    <div
      [class]="'absolute top-4 left-4 z-10 flex gap-2 px-2 py-1 rounded font-label-sm text-label-sm backdrop-blur-sm ' + deal().badge.bgClass + ' ' + deal().badge.textClass"
    >
      <span class="material-symbols-outlined icon-sm">{{ deal().badge.icon }}</span>
      {{ deal().badge.text }}
    </div>
  </div>

  <div class="p-rally-md flex-1 flex flex-col">
    <h3
      class="font-headline-md text-[20px] leading-[28px] text-on-surface mb-2 line-clamp-1"
    >
      <a [routerLink]="['/deals', deal().id]" class="hover:text-primary transition-colors">
        {{ deal().title }}
      </a>
    </h3>

    <div class="mb-4">
      <div class="flex items-center gap-rally-sm flex-wrap">
        <span class="font-headline-md text-headline-md text-primary">${{ deal().dealPrice }}</span>
        @if (savingsPercent() > 0) {
          <span class="save-badge">
            Save {{ savingsPercent() }}%
          </span>
        }
      </div>
      <p class="font-body-md text-body-md text-on-surface-variant line-through mt-1.5">
        ${{ deal().originalPrice }}
      </p>
    </div>

    <div class="mt-auto bg-surface-container-low rounded-lg p-3 border border-outline-variant/20">
      <div class="flex justify-between items-center mb-2">
        <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
          Progress
        </span>
        <span class="font-label-sm text-label-sm text-on-surface font-semibold">
          {{ progress() }}% Full
        </span>
      </div>
      <div class="progress-track mb-2">
        <div class="h-full progress-gradient rounded-full relative" [style.width.%]="progress()">
          <div class="progress-tip"></div>
        </div>
      </div>
      <div class="flex justify-between items-center mt-2">
        <span class="font-body-md text-[14px] text-on-surface-variant">
          <strong class="text-on-surface">{{ spotsLeft() }}</strong> spots left
        </span>
        <app-countdown [endAt]="deal().endsAt" />
      </div>
    </div>

    <a
      [routerLink]="['/deals', deal().id]"
      class="btn-primary bg-primary mt-rally-md w-full inline-flex items-center justify-center gap-rally-xs rounded-lg py-2.5 font-label-sm text-label-sm"
    >
      View Deal
      <span class="material-symbols-outlined icon-md">arrow_forward</span>
    </a>
  </div>
</article>
