<section
  class="bg-surface-container-lowest rounded-lg soft-shadow p-rally-md border border-outline-variant/30"
>
  <div class="flex items-center gap-rally-xs mb-rally-sm text-on-surface-variant">
    <span class="icon-lg">credit_card</span>
    <h2 class="label-caps-plain">Payment Method</h2>
  </div>

  @if (isLoading()) {
    <p class="font-body-md text-sm text-on-surface-variant">Loading payment methods...</p>
  } @else if (loadError()) {
    <p class="font-body-md text-sm text-error">Couldn't load your payment methods.</p>
  } @else {
    <div class="flex flex-col gap-rally-xs">
      @for (method of methods(); track method.id) {
        <button
          type="button"
          class="flex items-center gap-rally-sm p-rally-sm rounded-lg border transition-colors text-left hover:cursor-pointer"
          [class]="
            selectedId() === method.id
              ? 'border-primary bg-primary-container/10'
              : 'border-outline-variant hover:border-primary/50'
          "
          (click)="select(method.id)"
        >
          <span
            class="material-symbols-outlined text-[20px]"
            [class]="selectedId() === method.id ? 'text-primary' : 'text-on-surface-variant'"
          >
            {{ selectedId() === method.id ? 'radio_button_checked' : 'radio_button_unchecked' }}
          </span>
          <div
            class="bg-inverse-surface text-inverse-on-surface px-2 py-1 rounded text-xs font-bold tracking-wider"
          >
            {{ method.cardBrand.toUpperCase() }}
          </div>
          <div>
            <div class="font-body-md text-sm font-bold text-on-surface">
              •••• {{ method.cardLast4 }}
            </div>
            <div class="font-body-md text-xs text-on-surface-variant">
              Expires {{ method.cardExpMonth }}/{{ method.cardExpYear }}
            </div>
          </div>
        </button>
      } @empty {
        <p class="font-body-md text-sm text-on-surface-variant">No saved payment methods yet.</p>
      }
      <button
        type="button"
        (click)="openAddForm()"
        class="flex items-center gap-rally-xs p-rally-sm rounded-lg border border-dashed border-outline-variant text-on-surface-variant hover:text-primary hover:border-primary transition-colors hover:cursor-pointer"
      >
        <span class="icon-lg">add</span>
        <span class="font-label-sm text-label-sm">Add New Card</span>
      </button>
    </div>
  }
</section>
