<main class="grow pt-26 pb-rally-xl relative">
  <!-- Decorative Background -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-[128px] opacity-10"></div>
    <div class="absolute top-40 -left-20 w-72 h-72 bg-secondary-container rounded-full mix-blend-multiply filter blur-[96px] opacity-10"></div>
  </div>
  <div class="max-w-rally-container-max mx-auto px-rally-gutter relative z-10">
    <app-contact-header />
    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-rally-xl mb-rally-xl">
      <app-contact-info />
      <app-contact-form />
    </div>
    <app-contact-map />
  </div>
</main>
