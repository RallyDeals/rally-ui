<div class="flex flex-col h-full">
  <div class="mb-rally-lg">
    <div class="flex justify-between items-center">
      <h1 class="font-display-lg text-[24px] font-black text-primary tracking-tighter">RALLY.</h1>
      @if (showClose()) {
        <button
          type="button"
          class="p-rally-base text-on-surface-variant hover:text-primary transition-colors"
          (click)="close.emit()"
          aria-label="Close menu"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      }
    </div>
    @if (!showClose()) {
      <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Shop Together, Save More</p>
    }
  </div>

  <nav class="flex-1 flex flex-col gap-rally-xs">
    @for (item of navItems; track item.label) {
      @if (item.path) {
        <a [class]="navClass(item)" [routerLink]="item.path">
          <span class="material-symbols-outlined">{{ item.symbol }}</span>
          {{ item.label }}
        </a>
      } @else {
        <button type="button" [class]="navClass(item)" disabled>
          <span class="material-symbols-outlined">{{ item.symbol }}</span>
          {{ item.label }}
        </button>
      }
    }
  </nav>

  <div class="mt-auto pt-rally-md border-t border-outline-variant">
    <a [class]="navClass(storeItem)" [routerLink]="storeItem.path">
      <span class="material-symbols-outlined">{{ storeItem.symbol }}</span>
      {{ storeItem.label }}
    </a>
    <button type="button" [class]="navClass(settingsItem)" disabled>
      <span class="material-symbols-outlined">{{ settingsItem.symbol }}</span>
      {{ settingsItem.label }}
    </button>
    <div class="flex items-center gap-rally-sm mt-rally-md px-4">
      <img
        alt="User Profile"
        class="w-10 h-10 rounded-full object-cover border border-outline-variant"
        [src]="avatarUrl"
      />
      <div>
        <p class="font-label-sm text-label-sm font-semibold text-on-surface">{{ storeName }}</p>
        <p class="text-[10px] text-on-surface-variant">Seller Account</p>
      </div>
    </div>
  </div>
</div>
