<div class="flex flex-col h-full">
  <div class="mb-rally-lg">
    <div class="flex justify-between items-center">
      <h1 class="font-display-lg text-[24px] font-black text-primary tracking-tighter">RALLY.</h1>
      @if (showClose()) {
        <button
          type="button"
          class="p-rally-base text-on-surface-variant hover:text-primary transition-colors"
          (click)="close.emit()"
          aria-label="Close menu"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      }
    </div>
    @if (!showClose()) {
      <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Shop Together, Save More</p>
    }
  </div>

  <nav class="flex-1 flex flex-col gap-rally-xs">
    @for (item of navItems; track item.label) {
      @if (item.path) {
        <a [class]="navClass(item)" [routerLink]="item.path">
          <span class="material-symbols-outlined">{{ item.symbol }}</span>
          {{ item.label }}
        </a>
      } @else {
        <button type="button" [class]="navClass(item)" disabled>
          <span class="material-symbols-outlined">{{ item.symbol }}</span>
          {{ item.label }}
        </button>
      }
    }
  </nav>

  <div class="flex items-center justify-between gap-rally-sm mt-auto pt-rally-md border-t border-outline-variant">
    <div class="flex items-center gap-rally-sm px-4 min-w-0">
      <img
        alt="User Profile"
        class="w-10 h-10 rounded-full object-cover border border-outline-variant shrink-0"
        [src]="avatarUrl"
      />
      <div class="min-w-0">
        <p class="font-label-sm text-label-sm font-semibold text-on-surface truncate">{{ storeName }}</p>
        <p class="text-[10px] text-on-surface-variant truncate">{{ storeEmail }}</p>
      </div>
    </div>
    <app-icon-button symbol="logout" label="Logout" tone="error" (click)="logout()" />
  </div>
</div>
