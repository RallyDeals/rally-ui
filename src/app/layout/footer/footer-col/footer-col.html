<div class="flex flex-col gap-rally-sm">
  <h4 class="font-headline-md text-on-surface text-sm uppercase tracking-wider">{{title()}}</h4>
  @for (item of items(); track item.text) {
    <a class="text-on-surface-variant font-body-md hover:text-primary transition-colors" [routerLink]="item.route">{{item.text}}</a>
  }
</div>
