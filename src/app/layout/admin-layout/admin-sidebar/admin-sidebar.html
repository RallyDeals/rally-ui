<div class="flex flex-col h-full justify-between">
  <div>
    <div class="flex items-center gap-rally-xs mb-rally-lg">
      <app-logo />
      @if (showClose()) {
        <button
          type="button"
          class="p-rally-base text-on-surface-variant hover:text-primary transition-colors"
          (click)="close.emit()"
          aria-label="Close menu"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      }
    </div>
    <nav class="flex-1 flex flex-col gap-rally-base overflow-y-auto">
      @for (item of navItems; track item.label) {
        <a
          [class]="navClass(item)"
          [routerLink]="item.path"
          [attr.aria-current]="isActive(item) ? 'page' : null"
        >
          <span class="material-symbols-outlined group-hover:scale-110 transition-transform" [ngClass]="isActive(item) ? 'text-white' : 'text-on-surface-variant'">{{ item.symbol }}</span>
          <span class="font-body-md" [ngClass]="isActive(item) ? 'text-white' : 'text-on-surface-variant'">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <div class="pt-rally-md">
    <div class="bg-surface-container-highest rounded-xl p-rally-sm flex items-center gap-rally-sm">
      <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center">
        <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
      </div>
      <div class="flex-1 overflow-hidden">
        <p class="text-label-sm font-label-sm text-on-surface truncate">{{ adminName }}</p>
        <p class="text-[10px] text-on-surface-variant truncate">{{ adminEmail }}</p>
      </div>
    </div>
  </div>
</div>
