<div class="flex flex-col h-full justify-between">
  <div>
    <div class="flex items-center gap-rally-xs mb-rally-lg">
      <app-logo />
      @if (showClose()) {
        <button
          type="button"
          class="p-rally-base text-on-surface-variant hover:text-primary transition-colors"
          (click)="close.emit()"
          aria-label="Close menu"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      }
    </div>
    <nav class="flex-1 flex flex-col gap-rally-base overflow-y-auto">
      @for (item of navItems; track item.label) {
        <a
          [class]="navClass(item)"
          [routerLink]="item.path"
          [attr.aria-current]="isActive(item) ? 'page' : null"
        >
          <span class="material-symbols-outlined group-hover:scale-110 transition-transform"
                [ngClass]="isActive(item) ? 'text-white' : 'text-on-surface-variant'">{{ item.symbol }}</span>
          <span class="font-body-md"
                [ngClass]="isActive(item) ? 'text-white' : 'text-on-surface-variant'">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>
  <div class="flex items-center justify-between gap-rally-sm mt-auto pt-rally-md border-t border-outline-variant">
    <div class="flex items-center gap-rally-sm px-4 min-w-0">
      <img
        alt="User Profile"
        class="w-10 h-10 rounded-full object-cover border border-outline-variant shrink-0"
        [src]="avatarUrl"
      />
      <div class="min-w-0">
        <p class="font-label-sm text-label-sm font-semibold text-on-surface truncate">{{ adminName }}</p>
        <p class="text-[10px] text-on-surface-variant truncate">{{ adminEmail }}</p>
      </div>
    </div>
    <app-icon-button symbol="logout" label="Logout" tone="error" (click)="logout()" />
  </div>
</div>
