@for (link of navLinks(); track link.name) {
  <a class="py-3 text-on-surface-variant font-medium border-b border-outline-variant/10 hover:text-primary transition-colors flex items-center gap-2"
     [ngClass]="selectedLink() === link.name ? 'text-primary font-bold' : ''"
     [routerLink]="link.path" (click)="setSelectedLink()(link.name)">
    <span class="material-symbols-outlined text-sm">{{ link.symbol }}</span> {{ link.name }}
  </a>
}
