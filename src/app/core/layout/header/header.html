<nav
  class="glass-nav bg-surface/70 border-b border-outline-variant/30 shadow-sm fixed top-0 w-full z-50 transition-all duration-300"
  id="main-nav">
  <div class="flex justify-between items-center px-rally-gutter py-3 max-w-container-max mx-auto">
    <!-- Left: Mobile Toggle & Logo & Search -->
    <div class="flex items-center gap-rally-sm sm:gap-rally-md flex-1">
      <button class="md:hidden -ml-2 text-on-surface-variant hover:text-primary transition-colors h-[24px]" id="menu-toggle"
              (click)="toggleMenu()">
        <span class="material-symbols-outlined text-primary" id="menu-icon">menu</span>
      </button>
      <app-logo />

      <div class="hidden md:block md:relative flex-1 max-w-160 ml-2">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
        <input
          class="pl-10 pr-4 py-2 bg-surface-container-low border border-outline-variant rounded-full text-body-md focus:ring-1 focus:ring-primary transition-all w-full outline-none"
          placeholder="Search deals..." type="text" />
      </div>
    </div>
    <!-- Center: Navigation Links (Desktop) -->
    <app-desktop-nav-links [navLinks]="navLinks" [selectedLink]="selectedLink" [setSelectedLink]="setSelectedLink" />
    <!-- Right: Actions -->
    @if (loggedIn) {
      <div class="flex items-center gap-1 sm:gap-rally-sm">
        <button class="p-2 text-on-surface-variant hover:text-primary transition-colors relative" routerLink="/cart">
          <span class="material-symbols-outlined">shopping_cart</span>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-primary rounded-full"></span>
        </button>
        <button class="p-2 text-on-surface-variant hover:text-primary transition-colors" routerLink="/profile">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
        </button>
      </div>
    }@else{
      <div class="w-17">
        <app-primary-btn content="Sign In" bgClass="bg-on-primary-fixed-variant" routerLink="/auth/login" />
      </div>
    }
  </div>
  <!-- Mobile Navigation Menu -->
  <div
    [ngClass]="menuVisible ? 'max-h-96 opacity-100 py-4' : 'max-h-0 opacity-0 py-0 pointer-events-none'"
    class="absolute top-full left-0 w-full bg-surface border-b border-outline-variant/30 flex flex-col overflow-hidden px-rally-gutter shadow-lg transition-all duration-500 ease-out md:hidden"
    id="mobile-menu"
  >
    <app-mobile-nav-links [navLinks]="navLinks" [selectedLink]="selectedLink" [setSelectedLink]="setSelectedLink" />
  </div>
</nav>
