<div class="relative w-full">
  <span
    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-body-md"
    >search</span
  >
  <input
    class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm sm:text-body-md transition-all"
    [placeholder]="placeholder()"
    type="text"
    [value]="value()"
    (input)="valueChange.emit($any($event.target).value)"
  />
  @if (value()) {
    <button
      type="button"
      class="absolute right-2 top-1/2 -translate-y-1/2 p-1 text-on-surface-variant hover:text-primary transition-colors"
      (click)="clear.emit()"
      aria-label="Clear search"
    >
      <span class="icon-lg">close</span>
    </button>
  }
</div>
