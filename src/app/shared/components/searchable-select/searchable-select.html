<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    class="w-full flex items-center justify-between gap-rally-xs bg-surface-container-lowest border-none rounded-lg px-3 py-rally-xs text-body-md outline-none focus:ring-2 focus:ring-primary-container transition-all cursor-pointer"
  >
    <span class="truncate" [class.text-on-surface-variant]="!selectedLabel()">{{ selectedLabel() || placeholder() }}</span>
    <span
      class="material-symbols-outlined text-[18px] text-on-surface-variant transition-transform"
      [class.rotate-180]="open()"
      >expand_more</span
    >
  </button>

  @if (open()) {
    <div
      class="absolute z-20 mt-rally-xs w-full min-w-56 bg-surface-container-lowest rounded-lg shadow-lg border border-outline-variant/30 overflow-hidden"
    >
      <div class="p-rally-xs border-b border-outline-variant/30">
        <div class="relative">
          <span class="material-symbols-outlined absolute left-2 top-1/2 -translate-y-1/2 text-on-surface-variant text-[16px]"
            >search</span
          >
          <input
            type="text"
            class="w-full pl-9 pr-2 py-1.5 bg-surface-container-low rounded-md text-body-md outline-none focus:ring-2 focus:ring-primary-container transition-all"
            [placeholder]="searchPlaceholder()"
            [value]="query()"
            (input)="query.set($any($event.target).value)"
          />
        </div>
      </div>
      <ul class="max-h-56 overflow-y-auto py-1" role="listbox">
        <li>
          <button
            type="button"
            class="w-full text-left px-rally-md py-rally-xs text-body-md hover:bg-surface-container transition-colors"
            [class.bg-primary-container]="!selected()"
            [class.text-on-primary-container]="!selected()"
            (click)="choose('')"
          >
            {{ placeholder() }}
          </button>
        </li>
        @for (option of filteredOptions(); track option.value) {
          <li>
            <button
              type="button"
              class="w-full text-left px-rally-md py-rally-xs text-body-md hover:bg-surface-container transition-colors truncate"
              [class.bg-primary-container]="option.value === selected()"
              [class.text-on-primary-container]="option.value === selected()"
              (click)="choose(option.value)"
            >
              {{ option.label }}
            </button>
          </li>
        } @empty {
          <li class="px-rally-md py-rally-xs text-label-sm text-on-surface-variant">No results</li>
        }
      </ul>
    </div>
  }
</div>
