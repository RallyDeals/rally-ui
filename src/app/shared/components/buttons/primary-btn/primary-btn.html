@if (routerLink()) {
  <a
    [routerLink]="routerLink()"
    class="btn-primary w-full py-3 rounded-lg font-label-sm text-label-sm flex items-center justify-center gap-rally-xs"
    [ngClass]="[bgClass(), extraClasses(), disabled() ? 'opacity-50 pointer-events-none' : '']"
  >
    @if (icon()) {
      <span class="material-symbols-outlined filled-icon">{{ icon() }}</span>
    }
    {{ content() }}
  </a>
} @else {
  <button
    [type]="type()"
    [disabled]="disabled()"
    class="btn-primary w-full py-3 rounded-lg font-label-sm text-label-sm flex items-center justify-center gap-rally-xs"
    [ngClass]="[bgClass(), extraClasses(), disabled() ? 'opacity-50 cursor-not-allowed' : '']"
    (click)="!disabled() && clicked.emit()"
  >
    @if (icon()) {
      <span class="material-symbols-outlined filled-icon">{{ icon() }}</span>
    }
    {{ content() }}
  </button>
}
