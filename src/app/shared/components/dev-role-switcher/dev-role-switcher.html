@if (enabled) {
  <div
    class="fixed bottom-4 right-4 z-[100] flex items-center gap-1 rounded-full border border-outline-variant bg-surface-container-lowest shadow-xl p-1"
    role="group"
    aria-label="Dev role switcher"
  >
    <span class="icon-md text-on-surface-variant px-1" title="Dev role">
      key
    </span>
    @for (role of roles; track role) {
      <button
        type="button"
        class="px-3 py-1.5 rounded-full font-label-sm font-semibold capitalize transition-colors"
        [class]="activeRole() === role ? 'bg-primary-container text-on-primary' : 'text-on-surface-variant hover:bg-surface-container'"
        (click)="setRole(role)"
      >
        {{ role }}
      </button>
    }
  </div>
}
